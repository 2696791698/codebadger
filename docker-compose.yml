services:
  # Joern server (container)
  codebadger-joern-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebadger-joern-server:latest
    container_name: codebadger-joern-server
    ports:
      # Host and container ranges can differ. The app auto-discovers the published
      # host port for each internal Joern server port via Docker inspect.
      - "${JOERN_HOST_PORT_MIN:-13371}-${JOERN_HOST_PORT_MAX:-13870}:${JOERN_PORT_MIN:-13371}-${JOERN_PORT_MAX:-13870}"
    volumes:
      # Mount playground for CPG storage (shared with host)
      - ./playground:/playground
    restart: unless-stopped

